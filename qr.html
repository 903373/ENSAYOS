<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imprimir QR · Ensayos CJH</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{--morado:#111111;--dorado:#9e9e9e;--suave:#6b6b6b}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f4f4;color:#111111}
  .panel{max-width:900px;margin:0 auto;padding:20px}
  h1{color:var(--morado);margin:0 0 4px}
  p{color:var(--suave);margin:0 0 14px}
  textarea{width:100%;height:140px;font:14px ui-monospace,monospace;padding:10px;border-radius:10px;border:1.5px solid #d6d6d6}
  .fila{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 20px}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;background:var(--morado);color:#fff;cursor:pointer}
  button.sec{background:#ececec;color:var(--morado)}
  #hojas{display:grid;grid-template-columns:repeat(3, 63mm);gap:4mm;justify-content:center;padding:10mm 0}
  .t{width:63mm;height:88mm;background:#fff;border:1.5px solid var(--morado);border-radius:5mm;
     padding:4mm;display:flex;flex-direction:column;align-items:center;text-align:center;break-inside:avoid;
     position:relative;overflow:hidden}
  .t::before{content:"";position:absolute;top:0;left:0;right:0;height:17mm;background:var(--morado);border-bottom:1.2mm solid var(--dorado)}
  .t .cab{position:relative;color:var(--suave);font-size:7pt;font-weight:700;letter-spacing:.6px;margin-top:5.6mm;white-space:nowrap}
  .t .logo{position:relative;width:52mm;height:auto;margin-top:-1mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .t svg{width:46mm;height:46mm;margin-top:1.5mm}
  .t .nom{font-weight:700;font-size:11.5pt;margin-top:2mm;line-height:1.15}
  .t .num{font:700 8pt ui-monospace,monospace;color:var(--suave);margin-top:1mm}
  .t, .t::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @media print{
    @page{size:A4;margin:8mm}
    body{background:#fff}
    .panel{display:none}
    #hojas{padding:0}
  }
</style>
</head>
<body>
<div class="panel">
  <h1>Tarjetas QR para plastificar</h1>
  <p>Pega la lista copiada de la pestaña <b>Miembros</b> (columnas ID · Nombre) o cárgala desde la hoja.</p>
  <textarea id="datos" placeholder="001	Ejemplo Uno	Tambor&#10;002	Ejemplo Dos	Bombo"></textarea>
  <div class="fila">
    <button id="gen">Generar tarjetas</button>
    <button class="sec" id="cargar">Cargar desde la hoja</button>
    <button class="sec" onclick="print()">🖨️ Imprimir</button>
  </div>
  <p id="msg"></p>
</div>
<div id="hojas"></div>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = v => { let s = String(v||'').trim().toUpperCase(); if (s.startsWith('CJH:')) s = s.slice(4); return /^\d+$/.test(s) ? s.padStart(3,'0') : s; };

function svgQR(texto){
  const qr = qrcode(0, 'H');          // corrección alta: aguanta rayones y plastificado
  qr.addData(texto); qr.make();
  return qr.createSvgTag({cellSize: 4, margin: 2, scalable: true});
}

function generar(lista){
  $('#hojas').innerHTML = lista.map(m => `
    <div class="t">
      <img class="logo" src="${LOGO}" alt="">
      <div class="cab">SECCIÓN DE INSTRUMENTOS · 2027</div>
      ${svgQR('CJH:' + m.id)}
      <div class="nom">${esc(m.nombre)}</div>
      <div class="num">nº ${esc(m.id)}</div>
    </div>`).join('');
  $('#msg').textContent = `${lista.length} tarjetas (9 por folio A4).`;
}

$('#gen').onclick = () => {
  const lista = $('#datos').value.split(/\r?\n/).map(l => l.split(/\t|;|,/).map(x => x.trim()))
    .filter(c => c[0] && c[1] && !/^id$/i.test(c[0]))
    .map(c => ({id: norm(c[0]), nombre: c[1], instrumento: c[2] || ''}));
  generar(lista);
};

$('#cargar').onclick = async () => {
  let cfg; try{ cfg = JSON.parse(localStorage.getItem('cfg')); }catch(_){}
  if (!cfg){ $('#msg').textContent = 'Primero configura la app en este navegador (index.html) o pega la lista.'; return; }
  $('#msg').textContent = 'Cargando…';
  try{
    const r = await fetch(cfg.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'miembros', pin: cfg.pin})});
    const j = await r.json(); if (!j.ok) throw new Error(j.error);
    generar(j.miembros);
  }catch(e){ $('#msg').textContent = '❌ ' + e.message; }
};
</script>
